name: NEXA Build, Test & Release
on:
  push:
    branches: [main, 'feature/windows-desktop']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build
      - run: node --check main.js
      - name: Compare compiled output with published source
        run: git diff --exit-code -- main.js
      - name: Export desktop candidate binaries
        if: github.ref == 'refs/heads/feature/windows-desktop'
        uses: actions/upload-artifact@v4
        with:
          name: NEXA-Drive-Connect-Windows-Candidate
          path: |
            main.js
            manifest.json
          retention-days: 14
      - name: Publish matching stable release after verified build
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./manifest.json').version")"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Manifest version is not stable SemVer x.y.z" >&2
            exit 1
          fi
          if gh release view "$VERSION" >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/nexa-release"
            gh release download "$VERSION" -D "$RUNNER_TEMP/nexa-release" -p "main.js" -p "manifest.json"
            cmp main.js "$RUNNER_TEMP/nexa-release/main.js"
            cmp manifest.json "$RUNNER_TEMP/nexa-release/manifest.json"
            gh release edit "$VERSION" --prerelease=false --latest=true
            echo "Promoted verified $VERSION to a stable Obsidian-compatible release."
          else
            gh release create "$VERSION" main.js manifest.json \
              --title "NEXA Drive Connect $VERSION" \
              --notes-file STATUS.md \
              --target "$GITHUB_SHA" \
              --latest=true
          fi
