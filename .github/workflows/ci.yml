name: NEXA Build, Test & Prerelease
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build
      - run: node --check main.js
      - name: Compare compiled output with published source
        run: git diff --exit-code -- main.js
      - name: Publish candidate release (main only)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="$(node -p "require('./manifest.json').version")"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; no overwrite."
          else
            gh release create "$VERSION" main.js manifest.json \
              --title "NEXA Drive Connect $VERSION — teste iPhone pendente" \
              --notes-file STATUS.md \
              --prerelease \
              --target "$GITHUB_SHA"
          fi
